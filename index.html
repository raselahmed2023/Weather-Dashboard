<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-base-200 p-5">

  <main class="max-w-4xl mx-auto">

    <h1 class="text-4xl font-bold text-center mb-6">
      🌤️ Weather Dashboard
    </h1>

    <!-- Search -->
    <div class="card bg-base-100 shadow-xl p-5 mb-6">
      <div class="flex gap-2">
        <input
          id="cityInput"
          type="text"
          placeholder="Enter city name"
          class="input input-bordered w-full"
        >

        <button id="searchBtn" class="btn btn-primary">
          Search
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center hidden">
      <span class="loading loading-spinner loading-lg"></span>
      <p class="mt-2">Loading weather...</p>
    </div>

    <!-- Error -->
    <div id="error" class="alert alert-error hidden mb-5"></div>

    <!-- Weather -->
    <section id="weatherBox" class="hidden">

      <div class="card bg-primary text-primary-content shadow-xl mb-6">
        <div class="card-body text-center">
          <h2 id="cityName" class="text-3xl font-bold"></h2>
          <div id="weatherIcon" class="text-6xl"></div>
          <p id="temperature" class="text-5xl font-bold"></p>
          <p id="condition" class="text-lg"></p>
        </div>
      </div>

      <h2 class="text-2xl font-bold mb-4">3-Day Forecast</h2>

      <div id="forecast" class="grid md:grid-cols-3 gap-4"></div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
